name: SDKPatcher
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
targets:
  SDKPatcher:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ZIPFoundation
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SDK Patcher
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: IPA
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
              - public.zip-archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sdkpatcher
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
